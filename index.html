<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Rebirthed</title>
<style>
html,body{margin:0;height:100%;background:#050805}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Courier New",monospace;color:#7a7a7a}
canvas{max-width:100%;max-height:calc(100vh - 44px);outline:none;image-rendering:auto}
#bar{height:44px;display:flex;align-items:center;gap:10px;font-size:14px}
#bar input{background:#0b120b;color:#2bff5c;border:1px solid #2bff5c;font:inherit;padding:3px 8px;width:140px}
#bar input:focus-visible{outline:2px solid #7dff9b}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="bar"><label for="n">Codename</label><input id="n" maxlength="14" value="PLAYER" autocomplete="off"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),nameEl=document.getElementById('n');
const CW=10,CH=20,COLS=86,ROWS=26,W=46,H=20;
cv.width=COLS*CW;cv.height=ROWS*CH;
ctx.font='16px "Courier New",monospace';ctx.textBaseline='top';
const C={g:'#2bff5c',w:'#f2f2f2',d:'#777777',b:'#3b8cff',r:'#ff5a5a',y:'#ffd24a',p:'#a78bff',p2:'#c4b0ff',f:'#ff6b6b',s:'#1fbf45'};
const mem={};
const S={
get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
};
nameEl.value=S.get('snakeName','PLAYER');
nameEl.addEventListener('input',()=>S.set('snakeName',nameEl.value));
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'){nameEl.blur();cv.focus()}});
const getName=()=>(nameEl.value.trim()||'PLAYER').slice(0,14);
const ART=[
' ▄████████  ███▄▄▄▄      ▄████████    ▄█   ▄█▄    ▄████████ ',
'███    ███  ███▀▀▀██▄   ███    ███   ███ ▄███▀   ███    ███ ',
'███    █▀   ███   ███   ███    ███   ███▐███▀    ███    █▀  ',
'███         ███   ███   ███    ███  ▄█████▀      ███▄▄▄▄▄   ',
'▀█████████▄ ███   ███ ▀███████████ ▀▀█████▄     ▀▀███▀▀▀▀   ',
'         ██ ███   ███   ███    ███   ███▐███▄    ███    █▄  ',
'   ▄█    ██ ███   ███   ███    ███   ███ ▀███▄   ███    ███ ',
' ▄████████▀  ▀█   █▀    ███    █▀    ███   ▀█▄   ██████████ '
];
function T(c,r,s,col){
ctx.fillStyle=col||C.g;ctx.textAlign='center';
for(let i=0;i<s.length;i++){const ch=s[i];if(ch!==' ')ctx.fillText(ch,(c+i)*CW+CW/2,r*CH+1)}
ctx.textAlign='left';
}
function box(c,r,w,h,col){
T(c,r,'┌'+'─'.repeat(w-2)+'┐',col);
for(let i=1;i<h-1;i++){T(c,r+i,'│',col);T(c+w-1,r+i,'│',col)}
T(c,r+h-1,'└'+'─'.repeat(w-2)+'┘',col);
}
function header(){ART.forEach((l,i)=>T(4,2+i,l,C.g))}

let state='boot',bootT=0,sel=0,g=null,logs=[],input='',finalScore=0,startTime=0,last=0,acc=0;
const DIRS={UP:[0,-1],DOWN:[0,1],LEFT:[-1,0],RIGHT:[1,0]};
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1];

function mods(){return S.get('snakeMods',{e:1,c:1})}
function saveMods(e,c){S.set('snakeMods',{e,c})}
function board(){return S.get('snakeBoard',[])}
function registerRun(score,level){
const b=board(),now=new Date().toISOString().slice(0,16).replace('T',' ');
const u=getName(),rec=b.find(x=>x.username.toLowerCase()===u.toLowerCase());
if(rec){if(score>rec.high_score){rec.high_score=score;rec.max_level=level;rec.last_updated=now}}
else b.push({username:u,high_score:score,max_level:level,last_updated:now});
b.sort((a,c)=>c.high_score-a.high_score);
S.set('snakeBoard',b.slice(0,10));
}

function newGame(){
const m=mods();
g={snake:[[23,10],[22,10],[21,10]],dir:DIRS.RIGHT,next:DIRS.RIGHT,score:0,level:1,eaten:0,
sCd:0,sDur:0,sprint:false,combo:1,cTimer:0,xp:0,food:null,superFlag:false,isSuper:false,
ghost:false,freeze:false,cheats:true,expF:m.e,comboF:m.c,radar:0,bearing:'◆',tick:0};
spawn();updateRadar();
logs=['[SYSTEM]: Dev console mounted. Type /help'];input='';
startTime=Date.now();acc=0;
}
const xpReq=()=>Math.floor(200*g.level*1.5);
function turn(d){
const v=DIRS[d];
if(d==='UP'&&!same(g.dir,DIRS.DOWN))g.next=v;
else if(d==='DOWN'&&!same(g.dir,DIRS.UP))g.next=v;
else if(d==='LEFT'&&!same(g.dir,DIRS.RIGHT))g.next=v;
else if(d==='RIGHT'&&!same(g.dir,DIRS.LEFT))g.next=v;
}
function sprint(){
if(g.sCd===0&&!g.sprint){g.sprint=true;g.sDur=Math.max(4,12-Math.floor(g.level/2));g.sCd=40}
}
function updateRadar(){
const h=g.snake[0],f=g.food||[W/2,H/2],dx=f[0]-h[0],dy=f[1]-h[1];
g.radar=Math.floor(Math.sqrt(dx*dx+dy*dy));
if(Math.abs(dx)>Math.abs(dy))g.bearing=dx>0?'▶':'◀';
else if(Math.abs(dy)>Math.abs(dx))g.bearing=dy>0?'▼':'▲';
else g.bearing='◆';
}
function spawn(){
for(;;){
const f=[Math.floor(Math.random()*W),Math.floor(Math.random()*H)];
if(!g.snake.some(s=>same(s,f))){g.food=f;g.isSuper=g.superFlag;g.superFlag=false;return}
}
}
function levelUp(){
while(g.xp>=xpReq()&&g.level<10){g.xp-=xpReq();g.level++}
}
function timers(){
if(!g.freeze&&g.cTimer>0){g.cTimer--;if(g.cTimer===0)g.combo=1}
if(g.sprint){g.sDur--;if(g.sDur===0)g.sprint=false}
if(g.sCd>0)g.sCd--;
}
function step(){
g.dir=g.next;
const h=g.snake[0];
const nh=[(h[0]+g.dir[0]+W)%W,(h[1]+g.dir[1]+H)%H];
if(!g.ghost&&g.snake.some(s=>same(s,nh)))return false;
g.snake.unshift(nh);
if(same(nh,g.food)){
const fm=g.isSuper?3:1;
g.score+=Math.floor(10*g.combo*g.comboF*fm);
g.eaten++;
const cm=g.combo<=2?0.25:0.5*g.combo;
g.xp+=Math.floor(20*(1+g.level*0.25)*cm*g.expF*fm);
if(!g.freeze){g.combo=g.cTimer>0?Math.min(10,g.combo+1):2;g.cTimer=Math.floor(45+g.level*1.5)}
levelUp();spawn();
}else g.snake.pop();
timers();updateRadar();
return true;
}
function die(){
finalScore=g.score;
registerRun(g.score,g.level);
state='over';
}

function log(s){logs.push(s)}
function runCmd(raw){
const s=raw.trim().toLowerCase();
if(s==='exit'){state='play';acc=0;return}
if(s==='/help'){log('>> /help');return}
if(s==='clearlogs'){logs=['[SYSTEM]: Logs cleared.'];return}
if(s==='setcheats=0'){
g.cheats=false;g.expF=1;g.comboF=1;g.ghost=false;g.freeze=false;saveMods(1,1);
log('[SYSTEM]: All developer cheats set to false.');return;
}
if(s==='spawnsuperfood'){
if(!g.cheats)log('[DENIED]: Cheats are false.');
else{g.superFlag=true;log('[SUCCESS]: Next item drops as super variant.')}
return;
}
if(s.includes('=')){
if(!g.cheats){log('[DENIED]: Cheats are locked to false.');return}
const p=s.split('='),a=p[0].trim(),n=parseInt(p[1].trim(),10);
if(isNaN(n)){log('[ERROR]: Parameter parsing fault.');return}
if(a==='setcombo'&&n>=1&&n<=10){g.combo=n;g.freeze=true;log('[SUCCESS]: Constant combo set to '+n)}
else if(a==='setlevel'&&n>=1&&n<=10){g.level=n;g.eaten=0;log('[SUCCESS]: Level set to '+n)}
else if(a==='setpoints'&&n>=0){g.xp=n;levelUp();log('[SUCCESS]: Points set to '+n)}
else if(a==='setexpfactor'&&n>=2&&n<=6){g.expF=n;saveMods(g.expF,g.comboF);log('[SUCCESS]: Exp multiplier '+n+'x')}
else if(a==='setcombofactor'&&n>=2&&n<=6){g.comboF=n;saveMods(g.expF,g.comboF);log('[SUCCESS]: Combo yield '+n+'x')}
else if(a==='ghostmode'){g.ghost=n===1;log('[SUCCESS]: Ghost mode '+n)}
else if(a==='freezetimers'){g.freeze=n===1;log('[SUCCESS]: Timers frozen '+n)}
else if(a==='warpsize'){
while(g.snake.length<n)g.snake.push(g.snake[g.snake.length-1].slice());
while(g.snake.length>n&&g.snake.length>2)g.snake.pop();
log('[SUCCESS]: Tail length '+n);
}else log('[ERROR]: Syntax verification failure.');
return;
}
if(s)log("[ERROR]: Invalid command '"+s+"'");
}

function drawBoot(){
header();
T(6,11,'[vitals.sys // terminal interface]',C.d);
const L=['Connecting to core...','Allocating grid space...','Syncing radar...','Loading storage...','Reading local leaderboard...','Runtime online.'];
const n=Math.min(L.length,Math.floor(bootT/200)+1);
for(let i=0;i<n;i++)T(6,13+i,'» '+L[i],i===L.length-1?C.g:C.w);
const f=Math.min(20,Math.floor(bootT/60));
T(6,20,'LOADING RUNTIME: ['+'█'.repeat(f)+'░'.repeat(20-f)+'] '+Math.floor(f/20*100)+'%',C.g);
}
function drawMenu(){
header();
T(6,11,'[vitals.sys // main menu]',C.d);
const o=['PLAY SNAKE','LOCAL LEADERBOARD'];
o.forEach((t,i)=>T(8,14+i*2,i===sel?'» '+t:'  '+t,i===sel?C.g:C.d));
T(6,19,'Move: W / S or arrows    Confirm: Enter    Tap also confirms',C.w);
T(6,21,'In game: WASD or arrows steer, Space sprints, Esc pauses, = opens console',C.d);
T(6,22,'Click the game once if keys do not respond.',C.d);
}
function drawBoard(){
header();
T(6,11,'LOCAL HIGH SCORES (this browser)',C.p);
const b=board().slice(0,8);
T(4,13,'┌──────┬──────────────────┬──────────────┬──────────┐');
T(4,14,'│ RANK │ CODENAME         │ HIGH SCORE   │ MAX LVL  │');
T(4,15,'├──────┼──────────────────┼──────────────┼──────────┤');
b.forEach((r,i)=>{
const row='│ '+String(i+1).padEnd(4)+' │ '+r.username.slice(0,16).padEnd(16)+' │ '+String(r.high_score).padStart(5,'0').padEnd(12)+' │ '+String(r.max_level).padStart(2,'0').padEnd(8)+' │';
T(4,16+i,row);
});
T(4,16+b.length,'└──────┴──────────────────┴──────────────┴──────────┘');
T(6,18+b.length,'Press Esc or Enter to return',C.d);
}
function lv(r,label,val,col){T(52,r,label,C.g);T(64,r,val,col||C.w)}
function drawHud(){
const need=xpReq(),pct=need>0?g.xp/need:0,fb=Math.floor(pct*10);
lv(5,'PLAYER     :','['+getName().slice(0,12)+']');
lv(6,'SCORE      :','['+String(g.score).padStart(5,'0')+']');
lv(7,'LEVEL      :','['+String(g.level).padStart(2,'0')+']');
lv(9,'XP METRIC  :','['+'█'.repeat(fb)+'░'.repeat(10-fb)+'] '+g.xp+'/'+need,C.b);
const cf=Math.floor(g.cTimer/45*8);
lv(10,'COMBO      :',g.combo>1?g.combo+'X COMBO ['+'█'.repeat(Math.min(8,cf))+'░'.repeat(Math.max(0,8-cf))+']':'NO COMBO  [░░░░░░░░]',g.combo>1?C.r:C.d);
const k=Math.floor(g.sCd/40*8);
lv(11,'SPRINT     :',g.sCd>0?'RECHARGING ['+'░'.repeat(8-k)+'█'.repeat(k)+']':'READY [████████]',g.sCd>0?C.y:C.g);
lv(12,'SNAKE      :','▲'+'■'.repeat(Math.min(6,g.snake.length-1))+(g.snake.length>7?'..x'+g.snake.length:''));
const rc=g.radar<=3?C.r:g.radar<=6?C.y:C.g;
T(52,14,'RADAR-NODE :',C.g);
T(66,14,'  [N]',C.d);
T(64,15,'[W]',C.d);T(68,15,g.bearing,rc);T(70,15,'[E]',C.d);
T(66,16,'  [S]',C.d);
T(64,17,'RANGE: '+String(g.radar).padStart(2,'0')+' BLK','#aaaaaa');
}
function drawGame(){
T(2,1,'VITALS ENGINE',C.g);T(16,1,'// TERMINAL FRAMEWORK V3.5',C.d);
box(1,3,48,22,C.g);box(50,3,36,22,C.g);
const f=g.food;
T(f[0]+2,f[1]+4,g.isSuper?'★':'⌺',g.isSuper?(Math.floor(g.tick/4)%2?C.p2:C.p):C.f);
g.snake.forEach((s,i)=>{
if(i===0){const d=g.dir;T(s[0]+2,s[1]+4,d[1]<0?'▲':d[1]>0?'▼':d[0]<0?'◀':'▶',C.g)}
else T(s[0]+2,s[1]+4,'■',C.s);
});
drawHud();
}
function drawPause(){
box(17,10,32,6,C.g);
for(let r=11;r<15;r++)T(18,r,' '.repeat(30));
T(18,11,'         SYSTEM PAUSED',C.w);
T(18,13,'  » [Esc]  Resume game',C.w);
T(18,14,'  » [Q]    Exit to menu',C.w);
}
function drawOver(){
header();
T(6,11,'SYSTEM CRASH DETECTED // IMPACT TERMINATION',C.r);
const top=board(),hs=top.length?Math.max(top[0].high_score,finalScore):finalScore;
box(8,13,58,4,C.g);
T(11,14,'FINAL SCORE: '+String(finalScore).padStart(5,'0')+' BLOCKS',C.w);
T(11,15,'HIGH SCORE:  '+String(hs).padStart(5,'0')+' BLOCKS',C.y);
T(8,18,'» Press Space (or tap) to play again',C.g);
T(8,19,'» Press Esc to return to the menu',C.d);
}
const SYN=['/help','exit','setcombo=<1-10>','setlevel=<1-10>','setpoints=<num>','setexpfactor=<2-6>','setcombofactor=<2-6>','spawnsuperfood','ghostmode=<0|1>','freezetimers=<0|1>','warpsize=<num>','clearlogs'];
function drawDev(){
ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
box(0,0,86,26,C.g);
T(2,1,'VITALS DIAGNOSTIC ENGINE',C.w);T(28,1,'// DEV CONSOLE  (Esc closes)',C.d);
for(let c=1;c<85;c++){T(c,2,'─');T(c,4,'─');T(c,21,'─')}
T(2,3,'LOGSTREAM',C.b);T(50,3,'COMMAND INDEX',C.b);
for(let r=3;r<21;r++)T(48,r,'│');
T(48,2,'┬');T(48,4,'┼');T(48,21,'┴');
logs.slice(-14).forEach((l,i)=>T(2,5+i,l.slice(0,44),C.w));
SYN.forEach((s,i)=>T(50,5+i,String(i+1).padStart(2,'0')+'. '+s,C.w));
T(2,23,'CONSOLE >> '+input+(Math.floor(Date.now()/400)%2?'_':' '),C.g);
}
function draw(){
ctx.fillStyle='#050805';ctx.fillRect(0,0,cv.width,cv.height);
if(state==='boot')drawBoot();
else if(state==='menu')drawMenu();
else if(state==='board')drawBoard();
else if(state==='over')drawOver();
else if(state==='dev')drawDev();
else{drawGame();if(state==='pause')drawPause()}
}
function frame(t){
const dt=Math.min(100,t-last);last=t;
if(state==='boot'){bootT+=dt;if(bootT>1500){state='menu'}}
if(state==='play'){
acc+=dt;
const iv=Math.max(20,60-g.level*5)*(g.sprint?0.4:1);
while(acc>=iv&&state==='play'){
acc-=iv;
if(!step()){die();break}
g.tick++;
}
}
draw();
requestAnimationFrame(frame);
}
function startGame(){newGame();state='play'}
function menuConfirm(){if(sel===0)startGame();else state='board'}
const KEYMAP={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',w:'UP',s:'DOWN',a:'LEFT',d:'RIGHT'};
addEventListener('keydown',e=>{
if(document.activeElement===nameEl)return;
const k=e.key,kl=k.length===1?k.toLowerCase():k;
if(k.startsWith('Arrow')||k===' '||k==='Backspace')e.preventDefault();
if(state==='menu'){
if(kl==='w'||k==='ArrowUp')sel=(sel+1)%2;
else if(kl==='s'||k==='ArrowDown')sel=(sel+1)%2;
else if(k==='Enter')menuConfirm();
}else if(state==='board'){
if(k==='Escape'||k==='Enter')state='menu';
}else if(state==='play'){
if(KEYMAP[kl])turn(KEYMAP[kl]);
else if(k===' ')sprint();
else if(k==='Escape')state='pause';
else if(k==='='){state='dev';input=''}
}else if(state==='pause'){
if(k==='Escape'){state='play';acc=0}
else if(kl==='q')state='menu';
}else if(state==='over'){
if(k===' ')startGame();
else if(k==='Escape')state='menu';
}else if(state==='dev'){
if(k==='Escape'){state='play';acc=0}
else if(k==='Enter'){const c=input;input='';runCmd(c)}
else if(k==='Backspace')input=input.slice(0,-1);
else if(k.length===1&&input.length<60)input+=k;
}
});
let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tx=t.clientX;ty=t.clientY},{passive:true});
cv.addEventListener('touchend',e=>{
const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
if(state==='play'){
if(Math.abs(dx)<12&&Math.abs(dy)<12)sprint();
else if(Math.abs(dx)>Math.abs(dy))turn(dx>0?'RIGHT':'LEFT');
else turn(dy>0?'DOWN':'UP');
}else if(state==='menu')menuConfirm();
else if(state==='over')startGame();
else if(state==='board')state='menu';
else if(state==='pause'){state='play';acc=0}
},{passive:true});
cv.addEventListener('mousedown',()=>cv.focus());
cv.focus();
requestAnimationFrame(frame);
</script>
</body>
</html>
